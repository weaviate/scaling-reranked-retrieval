[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scaling-reranked-retrieval"
version = "0.1.0"
description = "Companion code for Scaling Reranked Retrieval: depth, stages, and width in staged retrieval pipelines (Weaviate hybrid retrieval + cross-encoder and listwise reranking)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # retrieval adapters (Weaviate + reranker provider SDKs)
    "weaviate-client[agents]>=4.16.4",
    "cohere>=5.16.1",
    "voyageai>=0.3.4",
    "zeroentropy>=0.1.0a11",
    "pydantic>=2.0",
    # experiment harness + analysis
    "query-agent-benchmarking>=0.7",
    # transitive pin: qab 0.7 imports engram.RetrievalConfig, removed in weaviate-engram 1.0
    "weaviate-engram==0.6.0",
    "packaging>=23.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "pyarrow>=15.0",
    "matplotlib>=3.10.5",
    # listwise LLM reranking (scripts/listwise_rerank.py) only
    "openai>=1.60",
    "tiktoken>=0.7.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: makes live provider API calls; requires the API keys in env (skips per-provider when a key is absent)",
]

[tool.setuptools.packages.find]
where = ["src"]
